name: Appine Release APK

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full lowercase Appine commit SHA (empty builds the selected branch tip)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: appine-release-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 29.0.14206865
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  release:
    name: Signed Appine arm64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout CI configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate requested source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi

      - name: Checkout Appine
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          path: appine
          persist-credentials: false

      - name: Confirm source revision
        working-directory: appine
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Rust toolchain and Android target
        working-directory: appine
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: appine -> target/android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            appine/android/**/*.gradle*
            appine/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Select Android tools
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: appine/target/rootfs
          key: appine-rootfs-${{ hashFiles('appine/scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        working-directory: appine
        run: scripts/fetch-rootfs

      - name: Install Zig
        env:
          ZIG_VERSION: 0.17.0
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components 1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: appine/target/ghostty
          key: appine-libghostty-vt-${{ hashFiles('appine/scripts/fetch-ghostty') }}

      - name: Fetch libghostty-vt
        working-directory: appine
        run: scripts/fetch-ghostty

      - name: Build and lint release
        working-directory: appine/android
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease lintRelease --console=plain

      - name: Restore Appine release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APPINE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::APPINE_RELEASE_KEYSTORE_BASE64 is required for release signing"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/appine-release.p12"

      - name: Align and sign Appine APK
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          APPINE_RELEASE_STORE_PASSWORD: ${{ secrets.APPINE_RELEASE_STORE_PASSWORD }}
          APPINE_RELEASE_KEY_ALIAS: ${{ secrets.APPINE_RELEASE_KEY_ALIAS }}
          APPINE_RELEASE_KEY_PASSWORD: ${{ secrets.APPINE_RELEASE_KEY_PASSWORD }}
        run: |
          for signing_variable in APPINE_RELEASE_STORE_PASSWORD APPINE_RELEASE_KEY_ALIAS APPINE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!signing_variable}" ]; then
              echo "::error::$signing_variable is required for release signing"
              exit 1
            fi
          done
          mkdir -p target/release
          apk_name="appine-1.0.1-${SOURCE_SHA:0:7}-release.apk"
          zipalign -P 16 -f 4 appine/android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/appine-aligned.apk"
          apksigner sign --ks "$RUNNER_TEMP/appine-release.p12" --ks-type PKCS12 \
            --ks-key-alias "$APPINE_RELEASE_KEY_ALIAS" \
            --ks-pass env:APPINE_RELEASE_STORE_PASSWORD --key-pass env:APPINE_RELEASE_KEY_PASSWORD \
            --v4-signing-enabled false --out "target/release/$apk_name" "$RUNNER_TEMP/appine-aligned.apk"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"
          cp appine/android/app/build/outputs/mapping/release/mapping.txt target/release/mapping.txt
          printf '%s\n' "$SOURCE_SHA" > target/release/SOURCE_SHA

      - name: Verify final APK
        env:
          APPINE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          zipalign -c -P 16 4 "target/release/$APK_NAME"
          python3 .github/scripts/verify_appine_release.py "target/release/$APK_NAME"
          cp target/apk-verification/result.json target/release/verification.json
          (cd target/release && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Upload APK, checksum, mapping and verification
        uses: actions/upload-artifact@v7
        with:
          name: appine-release-${{ inputs.source_sha || github.sha }}
          if-no-files-found: error
          path: target/release/*

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appine-release-diagnostics-${{ inputs.source_sha || github.sha }}
          if-no-files-found: ignore
          path: |
            appine/android/app/build/reports/lint-results-release.*
            target/apk-verification/*.txt
            target/release/*.apk

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/appine-release.p12"
